{% extends "base.html" %}
{% block title %}{{ _("Login") }} – lightAPRSinjector{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header">🔒 {{ _("Login") }}</div>
      <div class="card-body p-4">
        <form method="post" action="{{ url_for('login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="next" value="{{ next }}">

          <div class="mb-3">
            <label for="username" class="form-label">{{ _("Username") }}</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ username }}"
                   autocomplete="username" autocapitalize="none" required {% if not username %}autofocus{% endif %}>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">{{ _("Password") }}</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required {% if username %}autofocus{% endif %}>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="remember" name="remember" checked>
            <label class="form-check-label" for="remember">{{ _("Stay logged in for 30 days") }}</label>
          </div>

          <button type="submit" class="btn btn-primary w-100">{{ _("Log in") }}</button>
        </form>
      </div>
    </div>
    <p class="text-muted small mt-3 text-center">
      {{ _("The password is set with WEB_PASSWORD, or shown in the log on first start.") }}
    </p>
  </div>
</div>
{% endblock %}

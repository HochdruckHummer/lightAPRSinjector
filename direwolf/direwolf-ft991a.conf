# Direwolf for a Yaesu FT-991A, connected with a single USB cable.
#
# Over USB the FT-991A shows up as a sound card ("USB Audio CODEC") and two
# serial ports (CP2105 chip): the "Enhanced" port for CAT and the "Standard"
# port. Direwolf keys the transmitter with the RTS line of the Standard port.
#
# Copy to /etc/direwolf.conf (or ~/direwolf.conf) and adjust the lines marked "CHANGE".

# ---- Audio ----
# List sound cards with:  arecord -l
ADEVICE plughw:CARD=CODEC,DEV=0
ACHANNELS 1

# ---- Radio channel ----
CHANNEL 0
# CHANGE: your callsign. Direwolf uses it for its own messages; the packets
# from lightAPRSinjector already carry the callsign from its configuration.
MYCALL N0CALL
MODEM 1200

# PTT via RTS of the FT-991A "Standard" serial port.
# CHANGE if needed: find the stable name with  ls -l /dev/serial/by-id/
# The Standard port is usually the one ending in "-if01-port0" (ttyUSB1).
PTT /dev/serial/by-id/usb-Silicon_Labs_CP2105_Dual_USB_to_UART_Bridge_Controller_CHANGE-if01-port0 RTS

# Time between keying the transmitter and the first data (10 ms units).
# Increase if the start of packets is lost.
TXDELAY 30

# ---- Network ----
# lightAPRSinjector connects here. There is NO password: allow only the
# lightAPRSinjector host in your firewall and never forward this port to the internet.
KISSPORT 8001
# The AGW interface is not needed by lightAPRSinjector.
AGWPORT 0

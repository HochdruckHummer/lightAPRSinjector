# Direwolf for a handheld radio (e.g. Quansheng UV-K5, Baofeng) with an
# AIOC "All-In-One-Cable". The AIOC is a USB sound card with built-in PTT.
#
# Copy to /etc/direwolf.conf (or ~/direwolf.conf) and adjust the lines marked "CHANGE".

# ---- Audio ----
# List sound cards with:  arecord -l
ADEVICE plughw:CARD=AllInOneCable,DEV=0
ACHANNELS 1

# ---- Radio channel ----
CHANNEL 0
# CHANGE: your callsign. Direwolf uses it for its own messages; the packets
# from lightAPRSinjector already carry the callsign from its configuration.
MYCALL N0CALL
MODEM 1200

# PTT: recent AIOC firmware acts like a CM108 sound card with PTT.
PTT CM108
# Alternative for older firmware, via its virtual serial port:
# PTT /dev/ttyACM0 DTR -RTS

TXDELAY 30

# ---- Network ----
# lightAPRSinjector connects here. There is NO password: allow only the
# lightAPRSinjector host in your firewall and never forward this port to the internet.
KISSPORT 8001
AGWPORT 0
